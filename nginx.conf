server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/csv text/markdown;
    gzip_min_length 1024;

    # API proxy → Python FastAPI (génération PDF + sync OVH)
    location /api/ {
        proxy_pass http://api:8001/api/;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store";
    }

    # Private clinical data — mounted at runtime, never baked into the image
    location = /data/rapports/index.json {
        alias /var/cache/asclepios/rapports-index.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location /data/ {
        alias /data/;
        default_type application/octet-stream;
        types {
            application/json json;
            text/csv csv;
            text/markdown md;
            image/png png;
            image/jpeg jpg jpeg;
            application/pdf pdf;
        }
        add_header Cache-Control "no-store";
        autoindex off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
